[tool.poe.tasks]
solver-viewer-context = "python -m scripts.solver_recording_context"
solver-viewer-recording = "python -m scripts.solver_recording_torso"
test-solver-viewer = "node scripts/check_solver_viewer.cjs"
solver-viewer = "python -m scripts.generate_solver_viewer"
solver-viewer-serve = "python -m http.server 8773 --bind 127.0.0.1 --directory scripts"
native-check = "python scripts/native_build.py check"
native-configure = "python scripts/native_build.py configure"
native-build = "python scripts/native_build.py build"
native-install = "python scripts/native_build.py install"
test-native = "python scripts/native_build.py test"
test = "python -m pytest"
test-native-python = "python -m pytest skellyforge/tests/test_native_extension.py skellyforge/tests/test_native_rigid_fit.py skellyforge/tests/test_native_rigid_sequence.py skellyforge/tests/test_native_linked_rigid_fit.py skellyforge/tests/test_native_linked_sequence.py skellyforge/tests/test_native_chain_sequence.py skellyforge/tests/test_native_displacement.py skellyforge/tests/test_native_branching.py skellyforge/tests/test_native_torso.py skellyforge/tests/test_native_axial.py skellyforge/tests/test_native_indexed_targets.py skellyforge/tests/test_native_asymmetric_length.py"
build-wheel = "python scripts/native_build.py wheel"
solver-viewer-body = "python -m scripts.solver_recording_body"

solver-viewer-shoulders = "python -m scripts.solver_shoulder_comparison"
solver-viewer-shoulder-linkages = "python -m scripts.solver_shoulder_linkages"
recording-comparison = "python -m scripts.generate_recording_comparison"
solver-viewer-spine-equality = "python -m scripts.solver_spine_equality"
solver-viewer-full-recording = "python -m scripts.solver_full_recording"
solver-viewer-spine-proportions = "python -m scripts.solver_spine_proportions"
