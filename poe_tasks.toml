[tool.poe.tasks]
solver-viewer-context = "python -m scripts.solver_recording_context"
solver-viewer-recording = "python -m scripts.solver_recording_torso"
test-solver-viewer = "node scripts/check_solver_viewer.cjs"
solver-viewer = "python -m scripts.generate_solver_viewer"
solver-viewer-serve = "python -m http.server 8773 --bind 127.0.0.1 --directory scripts"
native-check = "python scripts/native_build.py check"
native-configure = "python scripts/native_build.py configure"
native-build = "python scripts/native_build.py build"
native-install = "python scripts/native_build.py install"
test-native = "python scripts/native_build.py test"
test = "python -m pytest"
test-native-python = "python -m pytest skellyforge/tests/test_native_extension.py skellyforge/tests/test_native_rigid_fit.py skellyforge/tests/test_native_rigid_sequence.py skellyforge/tests/test_native_linked_rigid_fit.py skellyforge/tests/test_native_linked_sequence.py skellyforge/tests/test_native_chain_sequence.py skellyforge/tests/test_native_displacement.py skellyforge/tests/test_native_branching.py skellyforge/tests/test_native_torso.py skellyforge/tests/test_native_axial.py skellyforge/tests/test_native_indexed_targets.py skellyforge/tests/test_native_asymmetric_length.py skellyforge/tests/test_native_window_sequence.py"
build-wheel = "python scripts/native_build.py wheel"
solver-viewer-body = "python -m scripts.solver_recording_body"

solver-viewer-shoulders = "python -m scripts.solver_shoulder_comparison"
solver-viewer-shoulder-linkages = "python -m scripts.solver_shoulder_linkages"
recording-comparison = "python -m scripts.generate_recording_comparison"
solver-viewer-spine-equality = "python -m scripts.solver_spine_equality"
solver-viewer-full-recording = "python -m scripts.solver_full_recording"
solver-viewer-spine-proportions = "python -m scripts.solver_spine_proportions"
solver-viewer-processing = "python -m scripts.solver_processing_comparison"

solver-viewer-spine-ratios = "python -m scripts.solver_spine_ratio_comparison"

solver-viewer-sc-offset = "python -m scripts.solver_sc_offset_comparison"

solver-viewer-rest-lengths = "python -m scripts.solver_rest_length_comparison"
solver-viewer-sample-performance = "python -m scripts.solver_sample_performance"
solver-viewer-shared-spine = "python -m scripts.solver_shared_spine_length"
solver-viewer-axial-axes = "python -m scripts.solver_axial_axis_comparison"

solver-viewer-spine-stability = "python -m scripts.solver_spine_stability"
solver-viewer-sc-anterior = "python -m scripts.solver_sc_anterior_comparison"
solver-viewer-centerline = "python -m scripts.solver_centerline_comparison"
solver-viewer-length-coupling = "python -m scripts.solver_length_coupling"
solver-viewer-fixed-neck = "python -m scripts.solver_fixed_neck"
solver-viewer-spine-positions = "python -m scripts.solver_spine_positions"
solver-validate-spine-positions = "python -m scripts.solver_spine_validation"
