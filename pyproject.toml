[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.28,<4"
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = ["skellyforge"]
install.components = ["python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "skellyforge/__init__.py"

[tool.poe]
include = "poe_tasks.toml"
executor.type = "simple"

[project]
name = "skellyforge"
description = "The standard human: a YAML-defined skeleton and the closed-form math that hydrates it"
readme = "README.md"
authors = [{ name = "skellyforge", email = "info@freemocap.org" }]
license = { file = "LICENSE" }

classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)", #https://www.gnu.org/philosophy/open-source-misses-the-point.en.html
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
] #additional classifiers can be found here: https://pypi.org/classifiers/

# SciPy supplies the sparse least-squares optimizer for connected sequence fitting.
dependencies = [
    "numpy",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "beartype>=0.22.9",
    # Imported lazily: `__init__.py` currently configures stdlib logging instead, because
    # skellylogs' websocket handler cannot open its multiprocessing queue under every
    # sandbox. Restore the `skellylogs.configure_logging` call when the richer handlers
    # are wanted again.
    "skellylogs",
]

requires-python = ">=3.11,<3.13"

dynamic = ["version"]

[project.optional-dependencies]
recording-viewer = ["pyarrow>=18"]

# Dev-only tooling + the sibling repo for boundary tests. `[dependency-groups]` is used
# (not extras) so this is NEVER published: `pip install skellyforge` from PyPI cannot
# resolve skellytracker, and the runtime boundary (skellyforge never imports
# skellytracker) is preserved by construction.
[dependency-groups]
native = ["scikit-build-core>=0.11,<0.12", "pybind11>=3,<4", "cmake>=3.28,<4", "ninja", "poethepoet"]
dev = ["pytest>=9.1.1", "coverage", "black", "bumpver", "isort", "pip-tools", "skellytracker"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
skellylogs = { git = "https://github.com/freemocap/skellylogs", branch = "main" }
skellytracker = { git = "https://github.com/freemocap/skellytracker", branch = "development-streaming" }

[tool.pytest.ini_options]
# The suite exercises NumPy geometry and SciPy connected fitting. Recording-viewer
# tests that read Parquet additionally use the recording-viewer extra.
testpaths = ["skellyforge/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["skellyforge"]
omit = ["skellyforge/tests/*"]

[tool.bumpver] #bump the version by entering `bumpver update` in the terminal
current_version = "v2024.12.1009"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ["{version}"]
"skellyforge/__init__.py" = ["{version}"]

[project.scripts]
skellyforge = "skellyforge.__main__:run"
