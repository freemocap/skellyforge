[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.poe]
include = ["poe_tasks.toml"]
executor.type = "simple"

[project]
name = "skellyforge"
description = "The standard human: a YAML-defined skeleton and the closed-form math that hydrates it"
readme = "README.md"
authors = [{ name = "skellyforge", email = "info@freemocap.org" }]
license = { file = "LICENSE" }

classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)", #https://www.gnu.org/philosophy/open-source-misses-the-point.en.html
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
] #additional classifiers can be found here: https://pypi.org/classifiers/

dependencies = [
    "numpy",
    "pyyaml>=6.0",
    "beartype>=0.22.9",
    "skellylogs",
]

requires-python = ">=3.11,<3.13"

dynamic = ["version"]

[project.optional-dependencies]
recording-viewer = ["pyarrow>=18"]

# The historical tracker-mapping authoring helper still uses skellytracker.
# Keep that dependency development-only; relocating it is a separate core handoff.
[dependency-groups]
dev = ["poethepoet", "pytest>=9.1.1", "coverage", "black", "bumpver", "isort", "pip-tools", "skellytracker"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
skellylogs = { git = "https://github.com/freemocap/skellylogs", branch = "main" }
skellytracker = { git = "https://github.com/freemocap/skellytracker", branch = "development-streaming" }

[tool.pytest.ini_options]
# Core geometry tests use synthetic fixtures. Explicit reference-recording tests
# additionally use the recording-viewer extra for PyArrow.
testpaths = ["skellyforge/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["skellyforge"]
omit = ["skellyforge/tests/*"]

[tool.bumpver] #bump the version by entering `bumpver update` in the terminal
current_version = "v2024.12.1009"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ["{version}"]
"skellyforge/__init__.py" = ["{version}"]

[project.scripts]
skellyforge = "skellyforge.__main__:run"
