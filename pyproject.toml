# pyproject.toml

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "skellyforge"
description = "Basic template of a python repository"
readme = "README.md"
authors = [{ name = "skellyforge", email = "info@freemocap.org" }]
license = { file = "LICENSE" }




classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)", #https://www.gnu.org/philosophy/open-source-misses-the-point.en.html
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
] #additional classifiers can be found here: https://pypi.org/classifiers/


dependencies = [
    "numpy",#<2",
    "scipy",
    "pandas",
    "toml>=0.10.2",
    "pyyaml>=6.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.13.4",
    # ── The one sanctioned lateral import ─────────────────────────────────────
    # skellytracker, BASE package only (no detector extras — no onnxruntime /
    # mediapipe / torch), is imported for the tracker→standard-human mapping
    # contract: the model validates the mappings at load time instead of
    # duplicating the mapping machinery or shipping a stale golden fixture.
    # The sub-skelly boundary is deliberately leaky here — the slop of
    # maintaining the alternative is worse than the leak. skellytracker's
    # extras-based design is what keeps this import lightweight.
    "skellytracker",
]

requires-python = ">=3.11,<3.13"

dynamic = ["version"]

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest"]

[tool.uv.sources]
skellytracker = { git = "https://github.com/freemocap/skellytracker", branch = "development-streaming" }

[tool.pytest.ini_options]
# The engine suite runs on numpy + pydantic only — no heavy optional dependencies —
# so it stays fast and CI-cheap. Spec:
# freemocap/docs/streaming-compatibility/14-engine-testing-strategy.md
testpaths = ["skellyforge/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.bumpver] #bump the version by entering `bumpver update` in the terminal
current_version = "v2024.12.1009"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ["{version}"]
"skellyforge/__init__.py" = ["{version}"]


[project.scripts]
skellyforge = "skellyforge.__main__:run"
