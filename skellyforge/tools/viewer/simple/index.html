<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkellyForge / Motion review</title><link rel="stylesheet" href="/simple.css"></head><body>
<header><strong>SkellyForge <span>/ Motion review</span></strong><select id="dataset" aria-label="Dataset"><option value="synthetic">Synthetic</option><option value="test">Test recording</option><option value="sample">Sample recording</option></select><div class="layers"><label><input id="fit" type="checkbox" checked>Fitted skeleton</label><label><input id="reference" type="checkbox">Reference segments</label><label><input id="fitAxes" type="checkbox">Skeleton axes</label><label><input id="referenceAxes" type="checkbox">Reference axes</label><label><input id="keypoints" type="checkbox">Keypoints</label><label><input id="landmarks" type="checkbox">Landmarks</label><label><input id="video" type="checkbox" checked>Video</label></div><a href="/" target="_blank">Detailed viewer</a></header>
<main id="workspace"><aside id="video-panel"><select id="camera" aria-label="Annotated camera"></select><div id="video-space"><img id="video-image" hidden alt="Frame-aligned annotated recording"><span id="video-note"></span></div></aside><div id="divider" tabindex="0" role="separator" aria-label="Resize video panel" aria-orientation="vertical"></div><section id="scene"><div class="scene-tools"><span class="red">Left</span><span class="blue">Right</span><span class="reference-color">Reference</span><span title="Local orthonormal basis vectors">Axes: X red / Y green / Z blue</span><button id="reset">Reset view</button></div><div id="loading">Loading synthetic fit...</div></section></main>
<footer><input id="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="Recording frame"><div class="transport"><button id="previous" aria-label="Previous frame">&#9664;</button><button id="play">Play</button><button id="next" aria-label="Next frame">&#9654;</button><label><input id="loop" type="checkbox" checked>Loop</label><select id="speed" aria-label="Playback speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select><output id="frame"></output><span id="caption"></span></div></footer><div id="tooltip" hidden></div>
<script src="/vendor/three.min.js"></script><script src="/vendor/OrbitControls.js"></script><script src="/simple.js"></script></body></html>
