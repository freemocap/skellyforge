<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkellyForge / Pipeline viewer</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#0c1520;color:#e5eef6}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{padding:14px 20px 10px;border-bottom:1px solid #304252;background:#14212f;display:flex;align-items:center;gap:22px}h1{font-size:20px;margin:0}small{display:block;color:#83cfc7;font-size:10px;letter-spacing:2px;margin-bottom:4px}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;background:#203347;border:1px solid #38516a;color:inherit;border-radius:5px;padding:8px 14px;cursor:pointer}button[aria-selected=true]{background:#285d5c;border-color:#79cfc3}button:disabled{opacity:.4;cursor:default}#about{padding:8px 20px;color:#b6cbd9;border-bottom:1px solid #304252;line-height:1.5;display:flex;gap:16px;align-items:start}#description{flex:1}details{max-width:40vw}summary{cursor:pointer;color:#8dd6cb}#sources{font:12px ui-monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto}iframe{border:0;width:100%;flex:1;min-height:0}#notice{padding:16px;color:#ffc78a}a{color:#91dad0}
</style></head><body>
<header><div><small>SKELLYFORGE / OBSERVABILITY</small><h1>Pipeline viewer</h1></div><nav aria-label="Dataset"><button data-view="synthetic" aria-selected="true">Synthetic humanoid</button><button data-view="synthetic-fit">Synthetic Ceres fit</button><button data-view="test" disabled>Test recording</button><button data-view="sample" disabled>Sample recording</button><button data-view="problem_inspector.html">Ceres / Test</button><button data-view="problem_inspector.html?dataset=synthetic">Ceres / Synthetic</button></nav></header>
<div id="about"><div id="description"></div><details><summary>Source & status</summary><div id="sources">Checking saved recording fits...</div></details></div>
<iframe id="view" title="SkellyForge pipeline visualization" src="/synthetic"></iframe>
<script>
const descriptions={synthetic:'Standard-human rest pose + selectable synthetic motion. Orange: hydrated segments. Cyan: connected fixed-length reconstruction, NOT the Ceres fit. Synthetic inputs here are landmarks; no tracker keypoints are fabricated. Use the motion and noise switches to examine geometry.',test:'Prepared test recording / mapped landmarks / saved segments / accepted Ceres skeleton fit. Toggle each layer independently; hover for identities. Playback covers the complete saved recording.',sample:'Prepared sample recording / mapped landmarks / saved segments / accepted Ceres skeleton fit. Annotated video follows recording frames. These are saved results; opening the viewer does not reprocess data.','problem_inspector.html':'Actual captured Ceres parameter and residual blocks, grouped by frame and segment. Fixed history and active frames are explicit. These are saved native problem snapshots, not a reconstructed diagram.'};
descriptions['synthetic-fit']='60-frame synthetic full-body motion through the same fit_human entry point as recording fits. Cyan: Ceres result. Orange: hydrated segments. Known ideal landmarks supply explicit one-to-one synthetic keypoint mappings; this is not a COCO detector simulation.';descriptions['problem_inspector.html?dataset=synthetic']=descriptions['problem_inspector.html'];
function select(name){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===name)));document.getElementById('description').textContent=descriptions[name];document.getElementById('view').src='/'+name;}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>select(b.dataset.view));document.getElementById('description').textContent=descriptions.synthetic;
fetch('/status').then(r=>r.json()).then(status=>{document.getElementById('sources').textContent=Object.entries(status).map(([name,s])=>name.toUpperCase()+': '+(s.available?s.frames+' frames\n'+s.source+'\nFit: '+s.fit:s.error)).join('\n\n');for(const name of ['test','sample','synthetic-fit'])document.querySelector('[data-view="'+name+'"]').disabled=!status[name].available;}).catch(e=>document.getElementById('sources').textContent=e.message);
</script></body></html>
