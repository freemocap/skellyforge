# Rest pose (T-pose) for the standard human, matching the VRM default humanoid.
# default-vrm.gltf.json5 in this directory is that humanoid as exported from the
# Blender VRM extension - the reference the orientations below were derived against,
# and what to check a change here against.
#
# The coordinate system is Blender's: right-handed, +x right, +y forward, +z up, with the
# feet standing on the z = 0 ground plane. This file carries ONLY per-segment rest
# geometry: each entry's optional `orientation` is a PARENT-RELATIVE [w, x, y, z]
# quaternion, defaulting to identity. The parent/child topology lives in
# human_skeleton.yaml's `joints:` section (the linkage layer); walking joints x
# orientations composes the world transforms. RestPose.from_yaml requires an entry for
# every segment of the skeleton.
#
# Every segment's local +z runs proximal -> distal, so an identity orientation means "this
# segment continues straight on from its parent". Only the following need to say more, and
# each is derived rather than dialled in:
#
#   clavicle    rotates its local x primary axis ~28 deg posteriorly, so the bone runs
#               from the sternoclavicular joint out and back to the acromion. Its child
#               compensates so the arm still reaches straight out.
#   upper_arm   maps local +z onto world -+x, so the arms reach out to the sides. The
#               right side is the left mirrored across the sagittal plane, which for a
#               quaternion is (w, x, -y, -z).
#   upper_leg   a half turn about x: local +z (toward the knee) becomes world -z, so the
#               legs point down. Its own mirror image, so both sides are identical.
#   foot        -63.86 deg about x. Composed with the leg's half turn this puts the ankle
#               0.0415 H above the ball, which is the ankle joint centre's height.
#   heel        +31.34 deg about x. Composed with the leg's half turn it aims the
#               0.0486 H calcaneus at the SAME height as the ball, so the foot has a flat
#               ground plane rather than a heel in the air.
#   toes        a half turn that lands the toes flat and forward from the ball.
#               Self-mirroring, so both sides are identical.

name: human
segments:
  pelvis: {}
  sacrolumbar: {}
  thoracic: {}
  cervical_spine: {}
  skull: {}
  left_clavicle:
    orientation: [0.969918, 0, 0, 0.243434]
  left_upper_arm:
    orientation: [-0.363242, -0.363242, 0.606676, 0.606676]
  left_lower_arm: {}
