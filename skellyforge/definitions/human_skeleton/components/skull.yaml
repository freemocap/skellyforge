
segments:
  SKULL:
    alias:
      - head
    reference_geometry:
      origin: head_center
      z_axis:
        landmark: skull_vertex
        type: exact
      y_axis:
        landmark: nose
        type: approximate
  EYE_BONE:
    sided: true
    alias:
      - eye
    reference_geometry:
      origin: head_center
      z_axis:
        landmark: eye_socket
        type: exact
      y_axis:
        landmark: skull_top
        type: approximate

  JAW:
    reference_geometry:
      origin: head_center
      x_axis:
        landmark: chin
        type: exact
      y_axis:
        landmark: left_ear
        type: approximate




landmarks:
  HEAD_CENTER:
    definition: "Geometric center of the foramen magnum, the hole at the base of the skull"
    reference_frame: neck
    local_position: [0, 157, 0]

  HEAD_VERTEX:
    definition: "Tippy top of the head, intersection of the coronal and sagittal sutures (bregma)"
    reference_frame: head
    LOCAL_POSITION: [0, 70, 0]

  NOSE:
    definition: "Tip of the nose"
    reference_frame: head
    LOCAL_POSITION: [0, -5, 40]

  EYE:
    sided: true
    definition: "Center of the left orbit (inner/outer canthus midpoint)"
    reference_frame: head
    local_position: [15, 10, 32]

  EAR:
    sided: true
    definition: "Entrance to the left ear canal (acoustic meatus)"
    reference_frame: head
    local_position: [35, -5, 0]

