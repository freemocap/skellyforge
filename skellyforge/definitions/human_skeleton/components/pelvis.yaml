segments:
  PELVIS:
    reference_geometry:
      origin: pelvis_origin
      x_axis:
        landmark: left_hip_socket
        type: exact
        negate: true
      z_axis:
        landmark: left_iliac_crest
        type: approximate
    anatomical_segment: lower_trunk
landmarks:
  PELVIS_ORIGIN:
    aliases:
    - hips_center
    - hip_center
    definition: Mean of the two hip sockets
    reference_frame: pelvis
    local_position:
    - 0
    - 0
    - 0
  SACRUM_TOP:
    aliases:
    - l5_s1_junction
    - lumbosacral_junction
    definition: Geometric center of the lumbosacral junction (L5/S1), the top of the
      sacrum
    reference_frame: pelvis
    local_position:
    - 0
    - -35
    - 95
  SACRUM:
    definition: Geometric center of the sacral body, around the S2 level
    reference_frame: pelvis
    local_position:
    - 0
    - -55
    - 40
  COCCYX_TIP:
    definition: Distal tip of the coccyx (tailbone apex)
    reference_frame: pelvis
    local_position:
    - 0
    - -40
    - -30
  PUBIC_SYMPHYSIS:
    definition: Geometric center of the pubic symphysis
    reference_frame: pelvis
    local_position:
    - 0
    - 60
    - -10
  HIP_SOCKET:
    aliases:
    - hip
    definition: Geometric center of the proximal surface of the hip socket (acetabulum)
    reference_frame: pelvis
    local_position:
    - -88
    - 0
    - 0
    sided: true
  ILIAC_CREST:
    aliases:
    - iliocristale
    definition: Most superior point of the iliac crest
    reference_frame: pelvis
    local_position:
    - -145
    - 0
    - 100
    sided: true
  ANTERIOR_SUPERIOR_ILIAC_SPINE:
    aliases:
    - ASIS
    definition: Anterior superior iliac spine (ASIS), the anterior bony prominence
      of the iliac crest
    reference_frame: pelvis
    local_position:
    - -125
    - 50
    - 70
    sided: true
  POSTERIOR_SUPERIOR_ILIAC_SPINE:
    aliases:
    - PSIS
    definition: Posterior superior iliac spine (PSIS), the posterior bony prominence
      of the iliac crest
    reference_frame: pelvis
    local_position:
    - -42
    - -55
    - 85
    sided: true
  SACROILIAC_JOINT:
    aliases:
    - SI_JOINT
    definition: Geometric center of the sacroiliac joint, where the sacrum meets the
      ilium
    reference_frame: pelvis
    local_position:
    - -25
    - -45
    - 80
    sided: true
