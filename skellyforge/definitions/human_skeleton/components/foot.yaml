sided: true
segments:
  HEEL:
    reference_geometry:
      origin: ankle_origin
      z_axis:
        landmark: calcaneus
        type: exact
    anatomical_segment: foot
  FOOT:
    reference_geometry:
      origin: ankle_origin
      z_axis:
        landmark: ball
        type: exact
    anatomical_segment: foot
  TOES:
    reference_geometry:
      origin: ball
      z_axis:
        landmark: toe_tip
        type: exact
    anatomical_segment: foot
landmarks:
  ANKLE_ORIGIN:
    definition: Geometric center of the ankle (talocrural) joint, where the leg meets
      the talus
    reference_frame: foot
    local_position:
    - 0
    - 0
    - 0
  CALCANEUS:
    definition: Posterior tip of the calcaneus (heel bone), the calcaneal tuberosity
    reference_frame: heel
    local_position:
    - 0
    - 0
    - 80
  BALL:
    definition: Geometric center of the ball of the foot, across the metatarsal heads
    reference_frame: foot
    local_position:
    - 0
    - 0
    - 155
  TOE_TIP:
    definition: Tip of the longest toe (second toe), apex of the distal phalanx
    reference_frame: toes
    local_position:
    - 0
    - 0
    - 45
