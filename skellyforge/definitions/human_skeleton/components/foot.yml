# Foot component.
#
# `sided: true` at the file level: authored for the LEFT foot; the loader emits
# left_* / right_* (right is mirrored across the sagittal plane).
# Each segment's local +y runs proximal -> distal along the bone. The foot is simplified
# to a midline ball and toe tip (the scaffold's single TOES segment), so the authored
# landmarks sit at x = 0 and left/right are mirror images. The ankle (talocrural) joint
# is the shared origin of the heel and foot; the ball is shared by the foot and toes.
# Millimetres, 50th-percentile adult; positions are estimates.

sided: true

segments:
  HEEL:
    reference_geometry:
      origin: ankle_origin
      y_axis:
        landmark: calcaneus
        type: exact

  FOOT:
    reference_geometry:
      origin: ankle_origin
      y_axis:
        landmark: ball
        type: exact

  TOES:
    reference_geometry:
      origin: ball
      y_axis:
        landmark: toe_tip
        type: exact

landmarks:

  ANKLE_ORIGIN:
    definition: "Geometric center of the ankle (talocrural) joint, where the leg meets the talus"
    reference_frame: foot
    local_position: [0, 0, 0]

  CALCANEUS:
    definition: "Posterior tip of the calcaneus (heel bone), the calcaneal tuberosity"
    reference_frame: heel
    local_position: [0, 45, 0]

  BALL:
    definition: "Geometric center of the ball of the foot, across the metatarsal heads"
    reference_frame: foot
    local_position: [0, 155, 0]

  TOE_TIP:
    definition: "Tip of the longest toe (second toe), apex of the distal phalanx"
    reference_frame: toes
    local_position: [0, 45, 0]
