segments:
  LUMBAR_SPINE:
    reference_geometry:
      origin: spine_l5
      y_axis:
        landmark: spine_l1_top
        type: exact

  CHEST:
    aliases:
      - thoracic_spine
      - thorax
      - ribs
      - ribcage
    reference_geometry:
      origin: spine_t12
      y_axis:
        landmark: spine_t1_top
        type: exact
      z_axis:
        landmark: xiphoid_process
        type: approximate

  CERVICAL_SPINE:
    reference_geometry:
      origin: spine_c7
      y_axis:
        landmark: spine_c1_top
        type: exact


landmarks:
# Vertebra landmarks. Each vertebra gets a base landmark (geometric center of its
# inferior surface) and a `_TOP` landmark (geometric center of its superior surface).
# Positions are anatomical estimates: the column runs up the local +y axis (superior)
# with the frame origin on the inferior-most vertebra base, using 50th-percentile
# vertebral body heights and disc thicknesses. Reconciling these with the segment
# frames is the rest-pose pass.
  SPINE_L5:
    definition: "Geometric center of the inferior surface (base) of the L5 vertebra"
    reference_frame: lumbar_spine
    local_position: [0, 0, 0]
  SPINE_L5_TOP:
    definition: "Geometric center of the superior surface (top) of the L5 vertebra"
    reference_frame: lumbar_spine
    local_position: [0, 25, 0]
