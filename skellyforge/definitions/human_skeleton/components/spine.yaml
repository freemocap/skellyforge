segments:
  LUMBAR_SPINE:
    reference_geometry:
      origin: sacrum_top
      z_axis:
        landmark: spine_t12
        type: exact
      y_axis:
        negate: true
        landmark: xiphoid_process
        type: approximate

  CHEST:
    aliases:
      - thoraxic_spine
      - thorax
      - ribs
      - ribcage
    reference_geometry:
      origin: spine_t12
      z_axis:
        landmark: spine_c7
        type: exact
      y_axis:
        negate: true
        landmark: xiphoid_process
        type: approximate

  CERVICAL_SPINE:
    reference_geometry:
      origin: spine_c7
      z_axis:
        landmark: spine_c1
        type: exact
      y_axis:
        negate: true
        landmark: xiphoid_process
        type: approximate


