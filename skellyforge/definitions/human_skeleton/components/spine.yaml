# Spine component: the three spine segments and the clavicle.
#
# Each spine segment is a straight rigid link between two vertebral-junction
# landmarks: its origin is the junction shared with the segment BELOW (an
# external, parent-owned landmark), and its primary is the junction shared with
# the segment ABOVE. The individual per-vertebra landmarks were removed - they
# added complexity without contributing anything the closed-form hydration can
# use, and the tracker cannot see individual vertebrae anyway.
#
# Local frame (right-handed, VRM convention): +x LEFT, +y UP, +z FORWARD.
# Units are millimetres, sized for a 50th-percentile adult. Junction heights are
# vertebral-column estimates; reconciling them with the segment frames is the
# rest-pose pass.

segments:
  LUMBAR_SPINE:
    reference_geometry:
      origin: sacrum_top
      y_axis:
        landmark: thoracolumbar_junction
        type: exact

  CHEST:
    aliases:
      - thoracic_spine
      - thorax
      - ribs
      - ribcage
    reference_geometry:
      origin: thoracolumbar_junction
      y_axis:
        landmark: cervicothoracic_junction
        type: exact
      z_axis:
        landmark: xiphoid_process
        type: approximate

  CERVICAL_SPINE:
    reference_geometry:
      origin: cervicothoracic_junction
      y_axis:
        landmark: craniocervical_junction
        type: exact

  CLAVICLE:
    sided: true
    aliases:
      - collarbone
    reference_geometry:
      origin: sternoclavicular
      x_axis:
        landmark: acromion
        type: exact


landmarks:
# Vertebral-junction landmarks - the boundaries between the spine segments.

  THORACOLUMBAR_JUNCTION:
    aliases:
      - thoracolumbar_joint
      - t12_l1_junction
      - chest_center
    definition: "Geometric center of the thoracolumbar junction (T12/L1), the boundary between the lumbar and thoracic spine"
    reference_frame: lumbar_spine
    local_position: [0, 165, 0]

  CERVICOTHORACIC_JUNCTION:
    aliases:
      - cervicothoracic_joint
      - c7_t1_junction
      - neck_center
    definition: "Geometric center of the cervicothoracic junction (C7/T1), the boundary between the thoracic and cervical spine"
    reference_frame: chest
    local_position: [0, 328, 0]

  CRANIOCERVICAL_JUNCTION:
    aliases:
      - craniocervical_joint
      - c1_skull_junction
    definition: "Geometric center of the craniocervical junction (C1/skull), the boundary between the cervical spine and the skull"
    reference_frame: cervical_spine
    local_position: [0, 128, 0]

# ---- Sternum + clavicle ----

  STERNOCLAVICULAR_NOTCH:
    aliases:
      - suprasternal_notch
      - jugular_notch
    definition: "Geometric center of the suprasternal notch, the dip at the top of the sternum between the two clavicles"
    reference_frame: chest
    local_position: [0, 210, 110]

  STERNOCLAVICULAR:
    sided: true
    aliases:
      - sc_joint
    definition: "Geometric center of the sternoclavicular joint, where the clavicle meets the manubrium of the sternum"
    reference_frame: chest
    local_position: [20, 210, 110]

  ACROMION:
    sided: true
    aliases:
      - shoulder_tip
    definition: "Geometric center of the acromion process of the scapula, the lateral tip of the shoulder"
    reference_frame: clavicle
    local_position: [140, 0, 0]

  XIPHOID_PROCESS:
    aliases:
      - xiphoid
      - xiphisternum
    definition: "Distal tip of the xiphoid process, the cartilaginous inferior end of the sternum"
    reference_frame: chest
    local_position: [0, 55, 130]
