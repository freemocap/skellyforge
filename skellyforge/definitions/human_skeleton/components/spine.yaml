  STERNOCLAVICULAR_NOTCH:
    definition: "Geometric center of the suprasternal notch, the dip at the top of the sternum"
    reference_frame: chest
    local_position: [-15, 271, 0]

  STERNOCLAVICULAR:
    sided: true
    definition: "[Side ] sternoclavicular joint"
    reference_frame: chest
    local_position: [-15, 271, 0]

  XIPHOID_PROCESS:
    alias:
      - xipoid
    sided: true
    definition: "Center of the sternoclavicular joint"
    reference_frame: chest
    local_position: [-15, 271, 0]
