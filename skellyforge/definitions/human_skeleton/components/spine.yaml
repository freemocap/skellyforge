segments:
  SACROLUMBAR:
    anatomical_segment: middle_trunk
    aliases:
    - lumbar_spine
    reference_geometry:
      origin: pelvis_origin
      z_axis:
        landmark: chest_center
        type: exact
  THORACIC:
    anatomical_segment: upper_trunk
    aliases:
    - chest
    - thorax
    - ribcage
    - thoracic_spine
    reference_geometry:
      origin: chest_center
      z_axis:
        landmark: neck_center
        type: exact
      y_axis:
        landmark: xiphoid_process
        type: approximate
  CERVICAL_SPINE:
    anatomical_segment: head_neck
    reference_geometry:
      origin: neck_center
      z_axis:
        landmark: craniocervical_junction
        type: exact
  CLAVICLE:
    sided: true
    anatomical_segment: upper_trunk
    aliases:
    - collarbone
    reference_geometry:
      origin: sternoclavicular
      x_axis:
        landmark: acromion
        type: exact
        negate: true
landmarks:
  CHEST_CENTER:
    aliases:
    - thoracolumbar_junction
    - thoracolumbar_joint
    - t12_l1_junction
    definition: Authored mid-torso point at the T12/L1 level, on the hip-center to
      shoulder-midpoint line
    reference_frame: sacrolumbar
    local_position:
    - 0.0
    - 0.0
    - 0.157928
  NECK_CENTER:
    aliases:
    - cervicothoracic_junction
    - cervicothoracic_joint
    - c7_t1_junction
    - shoulder_midpoint
    definition: Midpoint of the shoulder line, at the C7/T1 level
    reference_frame: thoracic
    local_position:
    - 0.0
    - 0.0
    - 0.127557
  CRANIOCERVICAL_JUNCTION:
    definition: Geometric center of the craniocervical junction (C1/skull), the boundary
      between the cervical spine and the skull
    reference_frame: cervical_spine
    local_position:
    - 0.0
    - 0.0
    - 0.077749
  STERNOCLAVICULAR_NOTCH:
    aliases:
    - suprasternal_notch
    - jugular_notch
    definition: Geometric center of the suprasternal notch, the dip at the top of
      the sternum between the two clavicles
    reference_frame: thoracic
    local_position:
    - 0.0
    - 0.048593
    - 0.127557
  STERNOCLAVICULAR:
    sided: true
    aliases:
    - sc_joint
    definition: Geometric center of the sternoclavicular joint, where the clavicle
      meets the manubrium of the sternum. Authored ANTERIOR of the spine plane on
      purpose - the shoulder girdle hangs off the front of the ribcage.
    reference_frame: thoracic
    local_position:
    - -0.012148
    - 0.048593
    - 0.127557
  ACROMION:
    sided: true
    aliases:
    - shoulder_tip
    definition: Geometric center of the acromion process of the scapula, the lateral
      tip of the shoulder
    reference_frame: clavicle
    local_position:
    - -0.096472
    - 0.0
    - 0.0
  XIPHOID_PROCESS:
    aliases:
    - xiphoid
    - xiphisternum
    definition: Distal tip of the xiphoid process, the cartilaginous inferior end
      of the sternum
    reference_frame: thoracic
    local_position:
    - 0.0
    - 0.078964
    - 0.033408
