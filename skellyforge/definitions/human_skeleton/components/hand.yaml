      origin: index_pip
      z_axis:
        landmark: index_dip
        type: exact
  INDEX_DISTAL_PHALANX:
    reference_geometry:
      origin: index_dip
      z_axis:
        landmark: index_tip
        type: exact
  MIDDLE_METACARPAL:
    reference_geometry:
      origin: middle_cmc
      z_axis:
        landmark: middle_mcp
        type: exact
  MIDDLE_PROXIMAL_PHALANX:
    reference_geometry:
      origin: middle_mcp
      z_axis:
        landmark: middle_pip
        type: exact
  MIDDLE_MIDDLE_PHALANX:
