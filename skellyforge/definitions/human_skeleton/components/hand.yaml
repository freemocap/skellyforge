        landmark: middle_dip
        type: exact
  MIDDLE_DISTAL_PHALANX:
    reference_geometry:
      origin: middle_dip
      z_axis:
        landmark: middle_tip
        type: exact
  RING_METACARPAL:
    reference_geometry:
      origin: ring_cmc
      z_axis:
        landmark: ring_mcp
        type: exact
  RING_PROXIMAL_PHALANX:
    reference_geometry:
      origin: ring_mcp
      z_axis:
        landmark: ring_pip
        type: exact
  RING_MIDDLE_PHALANX:
    reference_geometry:
      origin: ring_pip
      z_axis:
        landmark: ring_dip
        type: exact
  RING_DISTAL_PHALANX:
    reference_geometry:
      origin: ring_dip
      z_axis:
        landmark: ring_tip
        type: exact
  PINKY_METACARPAL:
    reference_geometry:
      origin: pinky_cmc
      z_axis:
        landmark: pinky_mcp
        type: exact
  PINKY_PROXIMAL_PHALANX:
    reference_geometry:
      origin: pinky_mcp
      z_axis:
        landmark: pinky_pip
        type: exact
  PINKY_MIDDLE_PHALANX:
    reference_geometry:
      origin: pinky_pip
      z_axis:
        landmark: pinky_dip
        type: exact
  PINKY_DISTAL_PHALANX:
    reference_geometry:
      origin: pinky_dip
      z_axis:
        landmark: pinky_tip
        type: exact

