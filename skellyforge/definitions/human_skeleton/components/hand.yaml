# Hand component.
#
# `sided: true` at the file level: every entry is authored for the LEFT hand and the
# loader emits left_* / right_* (right is mirrored across the sagittal plane).
# Local frame: origin at the radiocarpal joint, +z = distal (toward the fingertips),
# -x = radial (thumb side), +y = palmar. The hand is authored flat (y = 0); the thumb
# sits at -x and the pinky at +x, so sided entries legitimately span both signs of x.
# Millimetres, 50th-percentile adult; positions are estimates.

sided: true

segments:
  CARPALS:
    reference_geometry:
      origin: carpal_origin
      z_axis:
        landmark: middle_cmc
        type: exact
  THUMB_METACARPAL:
    reference_geometry:
      origin: thumb_cmc
      z_axis:
        landmark: thumb_mcp
        type: exact
  THUMB_PROXIMAL_PHALANX:
    reference_geometry:
      origin: thumb_mcp
      z_axis:
        landmark: thumb_ip
        type: exact
  THUMB_DISTAL_PHALANX:
    reference_geometry:
      origin: thumb_ip
      z_axis:
        landmark: thumb_tip
        type: exact
  INDEX_METACARPAL:
