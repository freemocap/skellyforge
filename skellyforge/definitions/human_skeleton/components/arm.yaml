sided: true
segments:
  UPPER_ARM:
    aliases:
    - humerus
    reference_geometry:
      origin: shoulder
      z_axis:
        landmark: elbow
        type: exact
    anatomical_segment: upper_arm
  LOWER_ARM:
    aliases:
    - forearm
    reference_geometry:
      origin: elbow
      z_axis:
        landmark: wrist
        type: exact
    anatomical_segment: forearm
landmarks:
  SHOULDER:
    aliases:
    - glenohumeral_joint
    definition: Geometric center of the glenohumeral joint (shoulder joint)
    reference_frame: upper_arm
    local_position:
    - 0
    - 0
    - 0
  ELBOW:
    aliases:
    - humeroulnar_joint
    definition: Geometric center of the elbow joint, near the trochlea of the humerus
    reference_frame: upper_arm
    local_position:
    - 0.0
    - 0.0
    - 0.182224
  WRIST:
    aliases:
    - radiocarpal_joint
    definition: Geometric center of the radiocarpal joint (wrist joint)
    reference_frame: lower_arm
    local_position:
    - 0.0
    - 0.0
    - 0.157928

# ── Joints and chains ──────────────────────────────────────────────────────
# The arm's linkage: clavicle hangs off the thorax, the arm hangs off the
# clavicle. `sided: true` expands at the skeleton level - the thoracic parent is
# the spine component's business, not repeated here.
joints:
  clavicle:
    sided: true
    parent: thoracic
    child: clavicle
    connect_at: sternoclavicular
  upper_arm:
    sided: true
    parent: clavicle
    child: upper_arm
    connect_at: acromion
  lower_arm:
    sided: true
    parent: upper_arm
    child: lower_arm

chains:
  left_arm:
    - left_clavicle
    - left_upper_arm
    - left_lower_arm
    - left_carpals
  right_arm:
    - right_clavicle
    - right_upper_arm
    - right_lower_arm
    - right_carpals
