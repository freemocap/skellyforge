name: human
coordinate_system: blender

# The computed properties this skeleton opts into. Centre of mass is NOT listed: every
# skeleton has one (unweighted mean of each segment's landmarks by default, overridden
# here by center_of_mass.yaml's de Leva weighted sums). These are the ones that need
# something a simpler skeleton would not have - a mass model, or a roll convention for
# segments that cannot measure their own.
derived_quantities:
- inertia
- extrapolated_center_of_mass
- center_of_pressure
- centroidal_moment_pivot
- roll_resolution

components:
  pelvis: { $include: components/pelvis.yaml }
  spine: { $include: components/spine.yaml }
  skull: { $include: components/skull.yaml }
  arm: { $include: components/arm.yaml }
  hand: { $include: components/hand.yaml }
  leg: { $include: components/leg.yaml }
  foot: { $include: components/foot.yaml }
#  face: { $include: components/face.yaml } #TODO - implement this

# ── Joints (the ontology's linkage layer) ──────────────────────────────
#
# The authoritative parent/child topology of the skeleton. Each entry is one
# joint: `parent` and `child` name segments, and `connect_at` names the
# PARENT-owned landmark the child's origin sits on - defaulting to the child's
# own origin landmark, which is exactly right for a shared joint. Joint keys
# form their own namespace and may be renamed freely without touching topology
# (they currently match their child segment's name for readability).
#
# Every joint defaults to a 3-dof ball with a zyx euler convention; a joint
# can override any of that with an explicit `convention:` block (sequence +
# angle_names) when a named clinical decomposition matters. Refining a
# convention is a data edit here, never a code change.
joints:
  sacrolumbar: {parent: pelvis, child: sacrolumbar, connect_at: pelvis_origin}
  thoracic: {parent: sacrolumbar, child: thoracic, connect_at: chest_center}
  cervical_spine: {parent: thoracic, child: cervical_spine, connect_at: neck_center}
  skull: {parent: cervical_spine, child: skull, connect_at: craniocervical_junction}

  clavicle:
    sided: true
    parent: thoracic
    child: clavicle
    connect_at: sternoclavicular
  upper_arm:
    sided: true
    parent: clavicle
    child: upper_arm
    connect_at: acromion
  lower_arm:
    sided: true
    parent: upper_arm
    child: lower_arm
  carpals:
    sided: true
    parent: lower_arm
    child: carpals
    connect_at: wrist

  thumb_metacarpal:
    sided: true
    parent: carpals
    child: thumb_metacarpal
  thumb_proximal_phalanx:
    sided: true
    parent: thumb_metacarpal
    child: thumb_proximal_phalanx
  thumb_distal_phalanx:
    sided: true
    parent: thumb_proximal_phalanx
    child: thumb_distal_phalanx
  index_metacarpal:
    sided: true
    parent: carpals
    child: index_metacarpal
  index_proximal_phalanx:
    sided: true
    parent: index_metacarpal
    child: index_proximal_phalanx
  index_middle_phalanx:
    sided: true
    parent: index_proximal_phalanx
    child: index_middle_phalanx
  index_distal_phalanx:
    sided: true
    parent: index_middle_phalanx
    child: index_distal_phalanx
  middle_metacarpal:
    sided: true
    parent: carpals
    child: middle_metacarpal
  middle_proximal_phalanx:
    sided: true
    parent: middle_metacarpal
    child: middle_proximal_phalanx
  middle_middle_phalanx:
    sided: true
    parent: middle_proximal_phalanx
    child: middle_middle_phalanx
  middle_distal_phalanx:
    sided: true
    parent: middle_middle_phalanx
    child: middle_distal_phalanx
  ring_metacarpal:
    sided: true
    parent: carpals
    child: ring_metacarpal
  ring_proximal_phalanx:
    sided: true
    parent: ring_metacarpal
    child: ring_proximal_phalanx
  ring_middle_phalanx:
    sided: true
    parent: ring_proximal_phalanx
    child: ring_middle_phalanx
  ring_distal_phalanx:
    sided: true
    parent: ring_middle_phalanx
    child: ring_distal_phalanx
  pinky_metacarpal:
    sided: true
    parent: carpals
    child: pinky_metacarpal
  pinky_proximal_phalanx:
    sided: true
    parent: pinky_metacarpal
    child: pinky_proximal_phalanx
  pinky_middle_phalanx:
    sided: true
    parent: pinky_proximal_phalanx
    child: pinky_middle_phalanx
  pinky_distal_phalanx:
    sided: true
    parent: pinky_middle_phalanx
    child: pinky_distal_phalanx

  upper_leg:
    sided: true
    parent: pelvis
    child: upper_leg
    connect_at: hip_socket
  lower_leg:
    sided: true
    parent: upper_leg
    child: lower_leg
  foot:
    sided: true
    parent: lower_leg
    child: foot
    connect_at: ankle
  toes:
    sided: true
    parent: foot
    child: toes
  heel:
    sided: true
    parent: lower_leg
    child: heel
    connect_at: ankle

chains:
  spine:
    - pelvis
    - sacrolumbar
    - thoracic
    - cervical_spine
    - skull
  left_arm:
    - left_clavicle
    - left_upper_arm
    - left_lower_arm
    - left_carpals
  right_arm:
    - right_clavicle
    - right_upper_arm
    - right_lower_arm
    - right_carpals
  left_leg:
    - left_upper_leg
    - left_lower_leg
    - left_foot
    - left_toes
  right_leg:
    - right_upper_leg
    - right_lower_leg
    - right_foot
    - right_toes
