name: human
coordinate_system: blender

# The computed properties this skeleton opts into. Centre of mass is NOT listed: every
# skeleton has one (unweighted mean of each segment's landmarks by default, overridden
# here by center_of_mass.yaml's de Leva weighted sums). These are the ones that need
# something a simpler skeleton would not have - a mass model, or a roll convention for
# segments that cannot measure their own.
derived_quantities:
- inertia
- extrapolated_center_of_mass
- center_of_pressure
- centroidal_moment_pivot
- roll_resolution

components:
  pelvis: { $include: components/pelvis.yaml }
  spine: { $include: components/spine.yaml }
  skull: { $include: components/skull.yaml }
  arm: { $include: components/arm.yaml }
  hand: { $include: components/hand.yaml }
  leg: { $include: components/leg.yaml }
  foot: { $include: components/foot.yaml }
#  face: { $include: components/face.yaml } #TODO - implement this

# Joints and chains are NOT declared here. Every joint lives in the component
# that owns its CHILD segment (the compositional home: move a part, its joints
# move with it), and chains live in the component that walks them. The loader
# merges each component's `joints:`/`chains:` into one namespace - which is why
# names must not collide across files - and runs one sided-expansion pass over
# all of them against the full loaded segment set.
