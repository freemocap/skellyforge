# Canonical body anatomical model — tracker-agnostic.
#
# Defines the standard Winter-anthropometry body skeleton with:
#   - 27 landmarks (23 COCO-WholeBody body points + 4 computed: head_center,
#     neck_center, trunk_center, hips_center)
#   - segment_connections (23 segments)
#   - center_of_mass_definitions (Winter 2009 body segment parameters)
#   - bone_length_ratios (Winter-style: bone_length / total_standing_height)
#   - joint_hierarchy (tree rooted at hips_center)
#
# All 27 entries in tracked_points are first-class landmarks. There is no
# "virtual marker" concept here — the per-tracker mapping YAMLs in
# skellytracker define HOW each canonical landmark is produced from tracker
# keypoints (1:1 passthrough, unweighted mean, or weighted sum).
#
# Anthropometric data from Winter (2009) and Drillis & Contini (1966).

name: canonical_body
tracker_name: canonical

order:
  - body

aspects:
  body:
    tracked_points:
      type: list
      names:
        - nose
        - left_eye
        - right_eye
        - left_ear
        - right_ear
        - left_shoulder
        - right_shoulder
        - left_elbow
        - right_elbow
        - left_wrist
        - right_wrist
        - left_hip
        - right_hip
        - left_knee
        - right_knee
        - left_ankle
        - right_ankle
        - left_big_toe
        - left_small_toe
        - left_heel
        - right_big_toe
        - right_small_toe
        - right_heel
        - head_center
        - neck_center
        - trunk_center
        - hips_center

    virtual_marker_definitions: null

    segment_connections:
      head:
        proximal: left_ear
        distal: right_ear
      neck:
        proximal: head_center
        distal: neck_center
      spine:
        proximal: neck_center
        distal: hips_center
      left_shoulder:
        proximal: neck_center
        distal: left_shoulder
      right_shoulder:
        proximal: neck_center
        distal: right_shoulder
      left_upper_arm:
        proximal: left_shoulder
        distal: left_elbow
      right_upper_arm:
        proximal: right_shoulder
        distal: right_elbow
      left_forearm:
        proximal: left_elbow
        distal: left_wrist
      right_forearm:
        proximal: right_elbow
        distal: right_wrist
      left_pelvis:
        proximal: hips_center
        distal: left_hip
      right_pelvis:
        proximal: hips_center
        distal: right_hip
      left_thigh:
        proximal: left_hip
        distal: left_knee
      right_thigh:
        proximal: right_hip
        distal: right_knee
      left_shank:
        proximal: left_knee
        distal: left_ankle
      right_shank:
        proximal: right_knee
        distal: right_ankle
      left_foot:
        proximal: left_ankle
        distal: left_big_toe
      right_foot:
        proximal: right_ankle
        distal: right_big_toe
      left_toes:
        proximal: left_ankle
        distal: left_small_toe
      right_toes:
        proximal: right_ankle
        distal: right_small_toe
      left_heel:
        proximal: left_ankle
        distal: left_heel
      right_heel:
        proximal: right_ankle
        distal: right_heel
      left_foot_bottom:
        proximal: left_heel
        distal: left_big_toe
      right_foot_bottom:
        proximal: right_heel
        distal: right_big_toe

    center_of_mass_definitions:
      head:
        segment_com_length: 0.5
        segment_com_percentage: 0.081
      spine:
        segment_com_length: 0.5
        segment_com_percentage: 0.497
      right_upper_arm:
        segment_com_length: 0.436
        segment_com_percentage: 0.028
      left_upper_arm:
        segment_com_length: 0.436
        segment_com_percentage: 0.028
      right_forearm:
        segment_com_length: 0.682
        segment_com_percentage: 0.022
      left_forearm:
        segment_com_length: 0.682
        segment_com_percentage: 0.022
      right_thigh:
        segment_com_length: 0.433
        segment_com_percentage: 0.1
      left_thigh:
        segment_com_length: 0.433
        segment_com_percentage: 0.1
      right_shank:
        segment_com_length: 0.433
        segment_com_percentage: 0.0465
      left_shank:
        segment_com_length: 0.433
        segment_com_percentage: 0.0465
      right_foot:
        segment_com_length: 0.5
        segment_com_percentage: 0.0145
      left_foot:
        segment_com_length: 0.5
        segment_com_percentage: 0.0145

    bone_length_ratios:
      # All ratios = bone_length / total_standing_height.
      # Keys use the FABRIK bone-key convention "parent->child".
      # Arms, legs: Winter (2009) and Drillis & Contini (1966).
      # Feet: heel from Winter; toe ratios are approximate
      # (no published standard for big_toe/small_toe specifically).
      left_shoulder->left_elbow:     0.186
      left_elbow->left_wrist:        0.146
      right_shoulder->right_elbow:   0.186
      right_elbow->right_wrist:      0.146
      left_hip->left_knee:           0.245
      left_knee->left_ankle:         0.246
      right_hip->right_knee:         0.245
      right_knee->right_ankle:       0.246
      left_ankle->left_heel:         0.024
      left_ankle->left_big_toe:      0.039   # ≈ foot length beyond ankle
      left_ankle->left_small_toe:    0.039   # approximate, same order
      right_ankle->right_heel:       0.024
      right_ankle->right_big_toe:    0.039
      right_ankle->right_small_toe:  0.039

    joint_hierarchy:
      hips_center:
        - left_hip
        - right_hip
        - trunk_center
      trunk_center:
        - neck_center
      neck_center:
        - left_shoulder
        - right_shoulder
        - head_center
      head_center:
        - nose
        - left_eye
        - right_eye
        - left_ear
        - right_ear
      left_shoulder:
        - left_elbow
      left_elbow:
        - left_wrist
      right_shoulder:
        - right_elbow
      right_elbow:
        - right_wrist
      left_hip:
        - left_knee
      left_knee:
        - left_ankle
      left_ankle:
        - left_big_toe
        - left_small_toe
        - left_heel
      right_hip:
        - right_knee
      right_knee:
        - right_ankle
      right_ankle:
        - right_big_toe
        - right_small_toe
        - right_heel
