name: rtmpose
tracker_name: RTMPose

#=================================
# Aspect Order
#=================================
# Must match the flat point order the RTMPose wholebody detector actually
# emits (skellytracker's rtmpose_wholebody_detector.py _MODEL_TO_SCHEMA_PERM
# comment: body(0..22) + right_hand(23..43) + left_hand(44..64) + face(65..132)).
# This order previously listed face before left/right hand, which does not
# match that layout: Human.add_tracked_points_numpy() slices the flat
# (frames, 133, 3) array by this order, so the mismatch put 21 real
# right-hand points + 21 real left-hand points into the first 42 "face"
# landmark slots, and only the last 26 slots held real (correctly
# positioned) face data. Fixing the order here makes the slicing match the
# detector's real layout, so face lands in one coherent cluster instead of
# being split into a floating, disconnected group.
order:
  - body
  - right_hand
  - left_hand
  - face

aspects:
  #=================================
  # Body Aspect Configuration
  #=================================
  body:
    tracked_points:
      type: list
      names:
        - nose
        - left_eye
        - right_eye
        - left_ear
        - right_ear
        - left_shoulder
        - right_shoulder
        - left_elbow
        - right_elbow
        - left_wrist
        - right_wrist
        - left_hip
        - right_hip
        - left_knee
        - right_knee
        - left_ankle
        - right_ankle
        - left_big_toe
        - left_small_toe
        - left_heel
        - right_big_toe
        - right_small_toe
        - right_heel

    virtual_marker_definitions:
      head_center:
        marker_names:
          - left_ear
          - right_ear
        marker_weights:
          - 0.5
          - 0.5
      neck_center:
        marker_names:
          - left_shoulder
          - right_shoulder
        marker_weights:
          - 0.5
          - 0.5
      trunk_center:
        marker_names:
          - left_shoulder
          - right_shoulder
          - left_hip
          - right_hip
        marker_weights:
          - 0.25
          - 0.25
          - 0.25
          - 0.25
      hips_center:
        marker_names:
          - left_hip
          - right_hip
        marker_weights:
          - 0.5
          - 0.5

    segment_connections:
      head: 
        proximal: left_ear
        distal: right_ear
      neck: 
        proximal: head_center
        distal: neck_center
      spine: 
        proximal: neck_center
        distal: hips_center
      left_shoulder:
        proximal: neck_center
        distal: left_shoulder
      right_shoulder:
        proximal: neck_center
        distal: right_shoulder
      left_upper_arm:
        proximal: left_shoulder
        distal: left_elbow
      right_upper_arm:
        proximal: right_shoulder
        distal: right_elbow
      left_forearm:
        proximal: left_elbow
        distal: left_wrist
      right_forearm:
        proximal: right_elbow
        distal: right_wrist
      left_pelvis:
        proximal: hips_center
        distal: left_hip
      right_pelvis:
        proximal: hips_center
        distal: right_hip
      left_thigh:
        proximal: left_hip
        distal: left_knee
      right_thigh:
        proximal: right_hip
        distal: right_knee
      left_shank:
        proximal: left_knee
        distal: left_ankle
      right_shank:
        proximal: right_knee
        distal: right_ankle
      left_foot:
        proximal: left_ankle
        distal: left_big_toe
      right_foot:
        proximal: right_ankle
        distal: right_big_toe
      left_toes:
        proximal: left_ankle
        distal: left_small_toe
      right_toes:
        proximal: right_ankle
        distal: right_small_toe
      left_heel:
        proximal: left_ankle
        distal: left_heel
      right_heel:
        proximal: right_ankle
        distal: right_heel
      left_foot_bottom:
        proximal: left_heel
        distal: left_big_toe  
      right_foot_bottom:
        proximal: right_heel
        distal: right_big_toe

    center_of_mass_definitions:
      head:
        segment_com_length: 0.5
        segment_com_percentage: 0.081
      spine:
        segment_com_length: 0.5
        segment_com_percentage: 0.497
      right_upper_arm:
        segment_com_length: 0.436
        segment_com_percentage: 0.028
      left_upper_arm:
        segment_com_length: 0.436
        segment_com_percentage: 0.028
      right_forearm:
        segment_com_length: 0.682
        segment_com_percentage: 0.022
      left_forearm:
        segment_com_length: 0.682
        segment_com_percentage: 0.022
      right_thigh:
        segment_com_length: 0.433
        segment_com_percentage: 0.1
      left_thigh:
        segment_com_length: 0.433
        segment_com_percentage: 0.1
      right_shank:
        segment_com_length: 0.433
        segment_com_percentage: 0.0465    
      left_shank:
        segment_com_length: 0.433
        segment_com_percentage: 0.0465
      right_foot:
        segment_com_length: 0.5
        segment_com_percentage: 0.0145
      left_foot:
        segment_com_length: 0.5
        segment_com_percentage: 0.0145 
      
    joint_hierarchy:
      hips_center:
        - left_hip
        - right_hip
        - trunk_center
      trunk_center:
        - neck_center
      neck_center:
        - left_shoulder
        - right_shoulder
        - head_center
      head_center:
        - nose
        - left_eye
        - right_eye
        - left_ear
        - right_ear
      left_shoulder:
        - left_elbow
      left_elbow:
        - left_wrist
      right_shoulder:
        - right_elbow
      right_elbow:
        - right_wrist
      left_hip:
        - left_knee
      left_knee:
        - left_ankle
      left_ankle:
        - left_big_toe
        - left_small_toe
        - left_heel
      right_hip:
        - right_knee
      right_knee:
        - right_ankle
      right_ankle:
        - right_big_toe
        - right_small_toe
        - right_heel
      
  #=================================
  # Face Aspect Configuration
  #=================================  
  face:
    tracked_points:
      type: generated
      names: 
        convention: face_{:04d}
        count: 68

    virtual_marker_definitions: null
    segment_connections: null
    center_of_mass_definitions: null
    joint_hierarchy: null

  #=================================
  # Left Hand Aspect Configuration
  #=================================  
  left_hand:
    tracked_points:
      type: list
      names:
        - hand_root
        - thumb1
        - thumb2
        - thumb3
        - thumb4
        - forefinger1
        - forefinger2
        - forefinger3
        - forefinger4
        - middle_finger1
        - middle_finger2
        - middle_finger3
        - middle_finger4
        - ring_finger1
        - ring_finger2
        - ring_finger3
        - ring_finger4
        - pinky_finger1
        - pinky_finger2
        - pinky_finger3
        - pinky_finger4

    virtual_marker_definitions: null
    segment_connections: null
    center_of_mass_definitions: null
    joint_hierarchy: null

  #=================================
  # Right Hand Aspect Configuration
  #=================================
  right_hand:
    tracked_points:
      type: list
      names:
        - hand_root
        - thumb1
        - thumb2
        - thumb3
        - thumb4
        - forefinger1
        - forefinger2
        - forefinger3
        - forefinger4
        - middle_finger1
        - middle_finger2
        - middle_finger3
        - middle_finger4
        - ring_finger1
        - ring_finger2
        - ring_finger3
        - ring_finger4
        - pinky_finger1
        - pinky_finger2
        - pinky_finger3
        - pinky_finger4

    virtual_marker_definitions: null
    segment_connections: null
    center_of_mass_definitions: null
    joint_hierarchy: null
    


