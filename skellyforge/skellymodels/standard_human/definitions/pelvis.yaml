# Midline root + hips. Matches default-vrm.gltf.json5 layout: root is the
# ground/master bone (parent null), hips is its child 0.85 m up. +Z up, +X forward,
# +Y = left. All # E positions are estimates - tune in Blender, read back.
landmarks:
  root_origin:
    definition: "The model root, at the ground origin directly beneath the hip center"
    reference_frame: root
    rest_position: [0, 0, 0]
  hips_center:
    definition: "Geometric center of the left and right hip sockets, anterior to the sacrum"
    reference_frame: root
    rest_position: [0, 850, 0]        # E  VRM root->hips = 0.85 m
  lumbosacral_junction:
    definition: "Geometric center of the lumbosacral junction (L5/S1), the top of the sacrum"
    reference_frame: hips
    rest_position: [0, 120, 0]        # E  (top of the sacrum)
  left_hip:
    definition: "Geometric center of the proximal surface of the left hip socket (acetabulum)"
    reference_frame: hips
    rest_position: [-88, 0, 0]        # E  (left = -X)
  right_hip:
    definition: "Geometric center of the proximal surface of the right hip socket (acetabulum)"
    reference_frame: hips
    rest_position: [88, 0, 0]         # E  (right = +X)
  left_iliac_crest:
    definition: "Most superior point of the left iliac crest"
    reference_frame: hips
    rest_position: [-88, 80, 0]       # E
  right_iliac_crest:
    definition: "Most superior point of the right iliac crest"
    reference_frame: hips
    rest_position: [88, 80, 0]        # E
  pubic_symphysis:
    definition: "Geometric center of the pubic symphysis"
    reference_frame: hips
    rest_position: [0, -40, 0]        # E  (down = -Y)
  left_anterior_superior_iliac_spine:
    definition: "Left anterior superior iliac spine (ASIS), the anterior bony prominence of the iliac crest"
    reference_frame: hips
    rest_position: [-100, 40, -55]    # E
  right_anterior_superior_iliac_spine:
    definition: "Right anterior superior iliac spine (ASIS), the anterior bony prominence of the iliac crest"
    reference_frame: hips
    rest_position: [100, 40, -55]     # E
  left_posterior_superior_iliac_spine:
    definition: "Left posterior superior iliac spine (PSIS), the posterior bony prominence of the iliac crest"
    reference_frame: hips
    rest_position: [-25, 50, 55]      # E
  right_posterior_superior_iliac_spine:
    definition: "Right posterior superior iliac spine (PSIS), the posterior bony prominence of the iliac crest"
    reference_frame: hips
    rest_position: [25, 50, 55]       # E
  sacral_base:
    definition: "Superior aspect (base) of the sacrum at S1 -- the top of the sacrum (near lumbosacral_junction)"
    reference_frame: hips
    rest_position: [0, 100, 25]       # E
  coccyx_tip:
    definition: "Distal tip of the coccyx (tailbone apex)"
    reference_frame: hips
    rest_position: [0, -35, 35]       # E

segments:
  root:
    parent: null
    origin_landmark: root_origin
    landmarks: [root_origin, hips_center]
    axes:
      - {axis: y, target_landmark: hips_center, rest_direction: [0, 0, 1]}
  hips:
    parent: root
    origin_landmark: hips_center
    landmarks: [hips_center, lumbosacral_junction, left_hip, right_hip, left_iliac_crest, right_iliac_crest, pubic_symphysis,
                left_anterior_superior_iliac_spine, right_anterior_superior_iliac_spine,
                left_posterior_superior_iliac_spine, right_posterior_superior_iliac_spine,
                sacral_base, coccyx_tip]
    axes:
      - {axis: y, target_landmark: lumbosacral_junction, rest_direction: [0, 0, 1]}
      - {axis: x, target_landmark: right_hip, rest_direction: [0, -1, 0]}
