sided: true

landmarks:
  # ---- Tarsal bones (hindfoot + midfoot) ----
  foot_talus:
    definition: "Center of the talus tarsal bone of the ankle"
    reference_frame: foot
    rest_position: [0, 0, 0]
  foot_calcaneus:
    definition: "Center of the calcaneus tarsal bone of the heel"
    reference_frame: foot
    rest_position: [0, -30, 25]
  foot_navicular:
    definition: "Center of the navicular tarsal bone of the midfoot"
    reference_frame: foot
    rest_position: [-5, 15, 25]
  foot_cuboid:
    definition: "Center of the cuboid tarsal bone of the midfoot"
    reference_frame: foot
    rest_position: [10, 15, 25]
  foot_medial_cuneiform:
    definition: "Center of the medial cuneiform tarsal bone of the midfoot"
    reference_frame: foot
    rest_position: [-5, 30, 25]
  foot_intermediate_cuneiform:
    definition: "Center of the intermediate cuneiform tarsal bone of the midfoot"
    reference_frame: foot
    rest_position: [0, 32, 25]
  foot_lateral_cuneiform:
    definition: "Center of the lateral cuneiform tarsal bone of the midfoot"
    reference_frame: foot
    rest_position: [5, 30, 25]

  # ---- Big toe ----
  foot_big_toe_metatarsophalangeal_joint:
    definition: "Center of the metatarsophalangeal joint of the big toe"
    reference_frame: first_metatarsal
    rest_position: [0, 62, 0]       # E  first metatarsal length (~62 mm)
  foot_big_toe_interphalangeal_joint:
    definition: "Center of the interphalangeal joint of the big toe"
    reference_frame: big_toe_proximal_phalanx
    rest_position: [0, 30, 0]       # E  hallux proximal phalanx length (~30 mm)
  foot_big_toe_tip:
    definition: "Distal tip of the big toe"
    reference_frame: big_toe_distal_phalanx
    rest_position: [0, 20, 0]       # E  hallux distal phalanx length (~20 mm)

  # ---- Second toe ----
  foot_second_toe_metatarsophalangeal_joint:
    definition: "Center of the metatarsophalangeal joint of the second toe"
    reference_frame: second_metatarsal
    rest_position: [0, 72, 0]       # E  second metatarsal length (~72 mm, longest)
  foot_second_toe_proximal_interphalangeal_joint:
    definition: "Center of the proximal interphalangeal joint of the second toe"
    reference_frame: second_toe_proximal_phalanx
    rest_position: [0, 15, 0]
  foot_second_toe_distal_interphalangeal_joint:
    definition: "Center of the distal interphalangeal joint of the second toe"
    reference_frame: second_toe_middle_phalanx
    rest_position: [0, 10, 0]
  foot_second_toe_tip:
    definition: "Distal tip of the second toe"
    reference_frame: second_toe_distal_phalanx
    rest_position: [0, 10, 0]

  # ---- Third toe ----
  foot_third_toe_metatarsophalangeal_joint:
    definition: "Center of the metatarsophalangeal joint of the third toe"
    reference_frame: third_metatarsal
    rest_position: [0, 65, 0]       # E  third metatarsal length (~65 mm)
  foot_third_toe_proximal_interphalangeal_joint:
    definition: "Center of the proximal interphalangeal joint of the third toe"
    reference_frame: third_toe_proximal_phalanx
    rest_position: [0, 15, 0]
  foot_third_toe_distal_interphalangeal_joint:
    definition: "Center of the distal interphalangeal joint of the third toe"
    reference_frame: third_toe_middle_phalanx
    rest_position: [0, 10, 0]
  foot_third_toe_tip:
    definition: "Distal tip of the third toe"
    reference_frame: third_toe_distal_phalanx
    rest_position: [0, 10, 0]

  # ---- Fourth toe ----
  foot_fourth_toe_metatarsophalangeal_joint:
    definition: "Center of the metatarsophalangeal joint of the fourth toe"
    reference_frame: fourth_metatarsal
    rest_position: [0, 60, 0]       # E  fourth metatarsal length (~60 mm)
  foot_fourth_toe_proximal_interphalangeal_joint:
    definition: "Center of the proximal interphalangeal joint of the fourth toe"
    reference_frame: fourth_toe_proximal_phalanx
    rest_position: [0, 14, 0]
  foot_fourth_toe_distal_interphalangeal_joint:
    definition: "Center of the distal interphalangeal joint of the fourth toe"
    reference_frame: fourth_toe_middle_phalanx
    rest_position: [0, 10, 0]
  foot_fourth_toe_tip:
    definition: "Distal tip of the fourth toe"
    reference_frame: fourth_toe_distal_phalanx
    rest_position: [0, 10, 0]

  # ---- Pinky toe ----
  foot_pinky_toe_metatarsophalangeal_joint:
    definition: "Center of the metatarsophalangeal joint of the pinky toe"
    reference_frame: fifth_metatarsal
    rest_position: [0, 53, 0]       # E  fifth metatarsal length (~53 mm)
  foot_pinky_toe_proximal_interphalangeal_joint:
    definition: "Center of the proximal interphalangeal joint of the pinky toe"
    reference_frame: pinky_toe_proximal_phalanx
    rest_position: [0, 13, 0]
  foot_pinky_toe_distal_interphalangeal_joint:
    definition: "Center of the distal interphalangeal joint of the pinky toe"
    reference_frame: pinky_toe_middle_phalanx
    rest_position: [0, 10, 0]
  foot_pinky_toe_tip:
    definition: "Distal tip of the pinky toe"
    reference_frame: pinky_toe_distal_phalanx
    rest_position: [0, 10, 0]

segments:
  foot:
    parent: lower_leg
    origin_landmark: ankle
    landmarks: [ankle, foot_talus, foot_calcaneus, foot_navicular, foot_cuboid, foot_medial_cuneiform, foot_intermediate_cuneiform, foot_lateral_cuneiform,
                foot_big_toe_metatarsophalangeal_joint, foot_second_toe_metatarsophalangeal_joint, foot_third_toe_metatarsophalangeal_joint,
                foot_fourth_toe_metatarsophalangeal_joint, foot_pinky_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_intermediate_cuneiform, rest_direction: [1, 0, 0]}
      - {axis: x, target_landmark: foot_cuboid,                 rest_direction: [0, 1, 0]}

  first_metatarsal:
    parent: foot
    origin_landmark: foot_medial_cuneiform
    landmarks: [foot_medial_cuneiform, foot_big_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_big_toe_metatarsophalangeal_joint, rest_direction: [1, 0, 0]}
  second_metatarsal:
    parent: foot
    origin_landmark: foot_intermediate_cuneiform
    landmarks: [foot_intermediate_cuneiform, foot_second_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_second_toe_metatarsophalangeal_joint, rest_direction: [1, 0, 0]}
  third_metatarsal:
    parent: foot
    origin_landmark: foot_lateral_cuneiform
    landmarks: [foot_lateral_cuneiform, foot_third_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_third_toe_metatarsophalangeal_joint, rest_direction: [1, 0, 0]}
  fourth_metatarsal:
    parent: foot
    origin_landmark: foot_cuboid
    landmarks: [foot_cuboid, foot_fourth_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_fourth_toe_metatarsophalangeal_joint, rest_direction: [1, 0, 0]}
  fifth_metatarsal:
    parent: foot
    origin_landmark: foot_cuboid
    landmarks: [foot_cuboid, foot_pinky_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_pinky_toe_metatarsophalangeal_joint, rest_direction: [1, 0, 0]}

  big_toe_proximal_phalanx:
    parent: first_metatarsal
    origin_landmark: foot_big_toe_metatarsophalangeal_joint
    landmarks: [foot_big_toe_metatarsophalangeal_joint, foot_big_toe_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_big_toe_interphalangeal_joint, rest_direction: [1, 0, 0]}
  big_toe_distal_phalanx:
    parent: big_toe_proximal_phalanx
    origin_landmark: foot_big_toe_interphalangeal_joint
    landmarks: [foot_big_toe_interphalangeal_joint, foot_big_toe_tip]
    axes:
      - {axis: y, target_landmark: foot_big_toe_tip, rest_direction: [1, 0, 0]}

  second_toe_proximal_phalanx:
    parent: second_metatarsal
    origin_landmark: foot_second_toe_metatarsophalangeal_joint
    landmarks: [foot_second_toe_metatarsophalangeal_joint, foot_second_toe_proximal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_second_toe_proximal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  second_toe_middle_phalanx:
    parent: second_toe_proximal_phalanx
    origin_landmark: foot_second_toe_proximal_interphalangeal_joint
    landmarks: [foot_second_toe_proximal_interphalangeal_joint, foot_second_toe_distal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_second_toe_distal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  second_toe_distal_phalanx:
    parent: second_toe_middle_phalanx
    origin_landmark: foot_second_toe_distal_interphalangeal_joint
    landmarks: [foot_second_toe_distal_interphalangeal_joint, foot_second_toe_tip]
    axes:
      - {axis: y, target_landmark: foot_second_toe_tip, rest_direction: [1, 0, 0]}

  third_toe_proximal_phalanx:
    parent: third_metatarsal
    origin_landmark: foot_third_toe_metatarsophalangeal_joint
    landmarks: [foot_third_toe_metatarsophalangeal_joint, foot_third_toe_proximal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_third_toe_proximal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  third_toe_middle_phalanx:
    parent: third_toe_proximal_phalanx
    origin_landmark: foot_third_toe_proximal_interphalangeal_joint
    landmarks: [foot_third_toe_proximal_interphalangeal_joint, foot_third_toe_distal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_third_toe_distal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  third_toe_distal_phalanx:
    parent: third_toe_middle_phalanx
    origin_landmark: foot_third_toe_distal_interphalangeal_joint
    landmarks: [foot_third_toe_distal_interphalangeal_joint, foot_third_toe_tip]
    axes:
      - {axis: y, target_landmark: foot_third_toe_tip, rest_direction: [1, 0, 0]}

  fourth_toe_proximal_phalanx:
    parent: fourth_metatarsal
    origin_landmark: foot_fourth_toe_metatarsophalangeal_joint
    landmarks: [foot_fourth_toe_metatarsophalangeal_joint, foot_fourth_toe_proximal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_fourth_toe_proximal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  fourth_toe_middle_phalanx:
    parent: fourth_toe_proximal_phalanx
    origin_landmark: foot_fourth_toe_proximal_interphalangeal_joint
    landmarks: [foot_fourth_toe_proximal_interphalangeal_joint, foot_fourth_toe_distal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_fourth_toe_distal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  fourth_toe_distal_phalanx:
    parent: fourth_toe_middle_phalanx
    origin_landmark: foot_fourth_toe_distal_interphalangeal_joint
    landmarks: [foot_fourth_toe_distal_interphalangeal_joint, foot_fourth_toe_tip]
    axes:
      - {axis: y, target_landmark: foot_fourth_toe_tip, rest_direction: [1, 0, 0]}

  pinky_toe_proximal_phalanx:
    parent: fifth_metatarsal
    origin_landmark: foot_pinky_toe_metatarsophalangeal_joint
    landmarks: [foot_pinky_toe_metatarsophalangeal_joint, foot_pinky_toe_proximal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_pinky_toe_proximal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  pinky_toe_middle_phalanx:
    parent: pinky_toe_proximal_phalanx
    origin_landmark: foot_pinky_toe_proximal_interphalangeal_joint
    landmarks: [foot_pinky_toe_proximal_interphalangeal_joint, foot_pinky_toe_distal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_pinky_toe_distal_interphalangeal_joint, rest_direction: [1, 0, 0]}
  pinky_toe_distal_phalanx:
    parent: pinky_toe_middle_phalanx
    origin_landmark: foot_pinky_toe_distal_interphalangeal_joint
    landmarks: [foot_pinky_toe_distal_interphalangeal_joint, foot_pinky_toe_tip]
    axes:
      - {axis: y, target_landmark: foot_pinky_toe_tip, rest_direction: [1, 0, 0]}

chains:
  big_toe:  {start: first_metatarsal, end: big_toe_distal_phalanx}
  second_toe: {start: second_metatarsal, end: second_toe_distal_phalanx}
  third_toe:  {start: third_metatarsal, end: third_toe_distal_phalanx}
  fourth_toe: {start: fourth_metatarsal, end: fourth_toe_distal_phalanx}
  pinky_toe:  {start: fifth_metatarsal, end: pinky_toe_distal_phalanx}
