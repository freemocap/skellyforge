# Foot (sided): the VRM foot (ankle -> ball) + toes (ball -> tips). All the
# extra anatomical foot landmarks (tarsals + individual toe joints) are KEPT as
# landmarks on these two segments - the metatarsal/toe SEGMENTS are merged away
# (VRM has no individual metatarsal/toe bones), but the landmark NAMES survive.
# Orientations are exact from default-vrm.gltf.json5: foot +Y = [0.898, 0, -0.44],
# toes +Y = [1, 0, 0]. Positions are estimates (# E).
sided: true

landmarks:
  # ---- Tarsal bones (hindfoot + midfoot), landmarks on the foot ----
  foot_talus:                  {definition: "Center of the talus tarsal bone of the ankle", reference_frame: foot, rest_position: [0, 0, 0]}
  foot_calcaneus:              {definition: "Center of the calcaneus tarsal bone of the heel", reference_frame: foot, rest_position: [0, -45, 22]}
  foot_navicular:              {definition: "Center of the navicular tarsal bone of the midfoot", reference_frame: foot, rest_position: [-9, 25, 22]}
  foot_cuboid:                 {definition: "Center of the cuboid tarsal bone of the midfoot", reference_frame: foot, rest_position: [15, 22, 26]}
  foot_medial_cuneiform:       {definition: "Center of the medial cuneiform tarsal bone of the midfoot", reference_frame: foot, rest_position: [-15, 50, 20]}
  foot_intermediate_cuneiform: {definition: "Center of the intermediate cuneiform tarsal bone of the midfoot", reference_frame: foot, rest_position: [-3, 53, 18]}
  foot_lateral_cuneiform:      {definition: "Center of the lateral cuneiform tarsal bone of the midfoot", reference_frame: foot, rest_position: [10, 49, 21]}
  foot_fifth_metatarsal_base:  {definition: "Tuberosity at the base of the fifth metatarsal (styloid process)", reference_frame: foot, rest_position: [18, 26, 25]}

  # ---- Metatarsophalangeal (ball) joints, landmarks on the foot ----
  foot_big_toe_metatarsophalangeal_joint:    {definition: "Center of the big toe MTP joint",    reference_frame: foot, rest_position: [-10, 193, 0]}
  foot_second_toe_metatarsophalangeal_joint: {definition: "Center of the second toe MTP joint", reference_frame: foot, rest_position: [-6, 193, 0]}
  foot_third_toe_metatarsophalangeal_joint:  {definition: "Center of the third toe MTP joint",  reference_frame: foot, rest_position: [0, 193, 0]}
  foot_fourth_toe_metatarsophalangeal_joint: {definition: "Center of the fourth toe MTP joint", reference_frame: foot, rest_position: [5, 193, 0]}
  foot_pinky_toe_metatarsophalangeal_joint:  {definition: "Center of the pinky toe MTP joint",  reference_frame: foot, rest_position: [10, 193, 0]}

  # ---- The ball of the foot (tracker-derived) ----
  foot_ball: {definition: "Ball of the foot, at the metatarsophalangeal joint line", reference_frame: foot, rest_position: [0, 193, 0]}

  # ---- Toe joints, landmarks on the toes ----
  foot_big_toe_interphalangeal_joint: {definition: "Center of the big toe IP joint",    reference_frame: toes, rest_position: [-10, 30, 0]}
  foot_big_toe_tip:                   {definition: "Distal tip of the big toe",          reference_frame: toes, rest_position: [-10, 50, 0]}
  foot_second_toe_proximal_interphalangeal_joint: {definition: "Center of the second toe PIP joint", reference_frame: toes, rest_position: [-6, 25, 0]}
  foot_second_toe_distal_interphalangeal_joint:   {definition: "Center of the second toe DIP joint", reference_frame: toes, rest_position: [-6, 35, 0]}
  foot_second_toe_tip:                            {definition: "Distal tip of the second toe", reference_frame: toes, rest_position: [-6, 45, 0]}
  foot_third_toe_proximal_interphalangeal_joint: {definition: "Center of the third toe PIP joint", reference_frame: toes, rest_position: [0, 22, 0]}
  foot_third_toe_distal_interphalangeal_joint:   {definition: "Center of the third toe DIP joint", reference_frame: toes, rest_position: [0, 32, 0]}
  foot_third_toe_tip:                            {definition: "Distal tip of the third toe", reference_frame: toes, rest_position: [0, 42, 0]}
  foot_fourth_toe_proximal_interphalangeal_joint: {definition: "Center of the fourth toe PIP joint", reference_frame: toes, rest_position: [5, 18, 0]}
  foot_fourth_toe_distal_interphalangeal_joint:   {definition: "Center of the fourth toe DIP joint", reference_frame: toes, rest_position: [5, 28, 0]}
  foot_fourth_toe_tip:                            {definition: "Distal tip of the fourth toe", reference_frame: toes, rest_position: [5, 38, 0]}
  foot_pinky_toe_proximal_interphalangeal_joint: {definition: "Center of the pinky toe PIP joint", reference_frame: toes, rest_position: [10, 15, 0]}
  foot_pinky_toe_distal_interphalangeal_joint:   {definition: "Center of the pinky toe DIP joint", reference_frame: toes, rest_position: [10, 25, 0]}
  foot_pinky_toe_tip:                            {definition: "Distal tip of the pinky toe", reference_frame: toes, rest_position: [10, 35, 0]}

segments:
  foot:
    parent: lower_leg
    origin_landmark: ankle
    landmarks: [ankle, foot_ball, foot_calcaneus, foot_talus, foot_navicular, foot_cuboid, foot_medial_cuneiform, foot_intermediate_cuneiform, foot_lateral_cuneiform, foot_fifth_metatarsal_base,
                foot_big_toe_metatarsophalangeal_joint, foot_second_toe_metatarsophalangeal_joint, foot_third_toe_metatarsophalangeal_joint,
                foot_fourth_toe_metatarsophalangeal_joint, foot_pinky_toe_metatarsophalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_ball, rest_direction: [0.898, 0, -0.44]}
      - {axis: x, target_landmark: foot_pinky_toe_metatarsophalangeal_joint, rest_direction: [0, 1, 0]}
  toes:
    parent: foot
    origin_landmark: foot_ball
    landmarks: [foot_ball, foot_big_toe_tip, foot_pinky_toe_tip, foot_big_toe_interphalangeal_joint,
                foot_second_toe_proximal_interphalangeal_joint, foot_second_toe_distal_interphalangeal_joint, foot_second_toe_tip,
                foot_third_toe_proximal_interphalangeal_joint, foot_third_toe_distal_interphalangeal_joint, foot_third_toe_tip,
                foot_fourth_toe_proximal_interphalangeal_joint, foot_fourth_toe_distal_interphalangeal_joint, foot_fourth_toe_tip,
                foot_pinky_toe_proximal_interphalangeal_joint, foot_pinky_toe_distal_interphalangeal_joint]
    axes:
      - {axis: y, target_landmark: foot_big_toe_tip, rest_direction: [1, 0, 0]}
      - {axis: x, target_landmark: foot_pinky_toe_tip, rest_direction: [0, 1, 0]}

chains:
  foot_toes: {start: foot, end: toes}
