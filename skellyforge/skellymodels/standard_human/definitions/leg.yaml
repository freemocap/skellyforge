sided: true

landmarks:
  # thigh
  knee:
    definition: "Center of the knee joint, intersection of the medial condyle of the femur and the tibia"
    reference_frame: upper_leg
    rest_position: [0, 0, -429]       # E  (femur length)
  greater_trochanter:
    definition: "Tip of the greater trochanter of the femur"
    reference_frame: upper_leg
    rest_position: [0, 20, -40]       # E
  lateral_femoral_condyle:
    definition: "Most lateral point of the lateral femoral condyle"
    reference_frame: upper_leg
    rest_position: [0, 20, -429]      # E
  medial_femoral_condyle:
    definition: "Most medial point of the medial femoral condyle"
    reference_frame: upper_leg
    rest_position: [0, -20, -429]     # E
  # calf
  ankle:
    definition: "Center of the ankle joint, geometric center of the medial and lateral malleoli"
    reference_frame: lower_leg
    rest_position: [0, 0, -430]       # E  (tibia length)
  tibial_tuberosity:
    definition: "Most anterior point of the tibial tuberosity"
    reference_frame: lower_leg
    rest_position: [0, 0, -60]        # E
  lateral_malleolus:
    definition: "Most lateral point of the lateral malleolus (distal fibula)"
    reference_frame: lower_leg
    rest_position: [0, 15, -430]      # E
  medial_malleolus:
    definition: "Most medial point of the medial malleolus (distal tibia)"
    reference_frame: lower_leg
    rest_position: [0, -15, -430]     # E

segments:
  upper_leg:
    parent: pelvis
    origin_landmark: hip
    landmarks: [hip, knee, greater_trochanter, lateral_femoral_condyle, medial_femoral_condyle]
    axes:
      - {axis: y, target_landmark: knee, rest_direction: [0, 0, -1]}
  lower_leg:
    parent: upper_leg
    origin_landmark: knee
    landmarks: [knee, ankle, tibial_tuberosity, lateral_malleolus, medial_malleolus]
    axes:
      - {axis: y, target_landmark: ankle, rest_direction: [0, 0, -1]}

chains:
  leg: {start: pelvis, end: foot}
