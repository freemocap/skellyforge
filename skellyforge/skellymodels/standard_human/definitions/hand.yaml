sided: true

landmarks:
  hand_thumb_cmc:
    definition: "Center of the carpometacarpal joint of the thumb (base of the thumb, in the palm)"
    reference_frame: hand
    rest_position: [-20, 80, 0]       # E  (medial -X)
  hand_thumb_mcp:
    definition: "Center of the metacarpophalangeal joint of the thumb"
    reference_frame: thumb_metacarpal
    rest_position: [0, 20, 0]         # E  (+Y toward the knuckle)
  hand_thumb_ip:
    definition: "Center of the interphalangeal joint of the thumb"
    reference_frame: thumb_proximal
    rest_position: [0, 30, 0]         # E
  hand_thumb_tip:
    definition: "Distal tip of the thumb"
    reference_frame: thumb_distal
    rest_position: [0, 25, 0]         # E
  hand_index_mcp:
    definition: "Center of the metacarpophalangeal joint of the index finger"
    reference_frame: hand
    rest_position: [-5, 100, 0]       # E
  hand_index_pip:
    definition: "Center of the proximal interphalangeal joint of the index finger"
    reference_frame: index_proximal
    rest_position: [0, 45, 0]         # E
  hand_index_dip:
    definition: "Center of the distal interphalangeal joint of the index finger"
    reference_frame: index_intermediate
    rest_position: [0, 25, 0]         # E
  hand_index_tip:
    definition: "Distal tip of the index finger"
    reference_frame: index_distal
    rest_position: [0, 20, 0]         # E
  hand_middle_mcp:
    definition: "Center of the metacarpophalangeal joint of the middle finger"
    reference_frame: hand
    rest_position: [0, 100, 0]        # E
  hand_middle_pip:
    definition: "Center of the proximal interphalangeal joint of the middle finger"
    reference_frame: middle_proximal
    rest_position: [0, 50, 0]         # E
  hand_middle_dip:
    definition: "Center of the distal interphalangeal joint of the middle finger"
    reference_frame: middle_intermediate
    rest_position: [0, 28, 0]         # E
  hand_middle_tip:
    definition: "Distal tip of the middle finger"
    reference_frame: middle_distal
    rest_position: [0, 22, 0]         # E
  hand_ring_mcp:
    definition: "Center of the metacarpophalangeal joint of the ring finger"
    reference_frame: hand
    rest_position: [5, 100, 0]        # E
  hand_ring_pip:
    definition: "Center of the proximal interphalangeal joint of the ring finger"
    reference_frame: ring_proximal
    rest_position: [0, 42, 0]         # E
  hand_ring_dip:
    definition: "Center of the distal interphalangeal joint of the ring finger"
    reference_frame: ring_intermediate
    rest_position: [0, 23, 0]         # E
  hand_ring_tip:
    definition: "Distal tip of the ring finger"
    reference_frame: ring_distal
    rest_position: [0, 18, 0]         # E
  hand_little_mcp:
    definition: "Center of the metacarpophalangeal joint of the little finger"
    reference_frame: hand
    rest_position: [15, 100, 0]       # E  (lateral +X)
  hand_little_pip:
    definition: "Center of the proximal interphalangeal joint of the little finger"
    reference_frame: little_proximal
    rest_position: [0, 35, 0]         # E
  hand_little_dip:
    definition: "Center of the distal interphalangeal joint of the little finger"
    reference_frame: little_intermediate
    rest_position: [0, 20, 0]         # E
  hand_little_tip:
    definition: "Distal tip of the little finger"
    reference_frame: little_distal
    rest_position: [0, 15, 0]         # E

segments:
  hand:
    parent: lower_arm
    origin_landmark: wrist
    landmarks: [wrist, hand_thumb_cmc, hand_index_mcp, hand_middle_mcp, hand_ring_mcp, hand_little_mcp]
    axes:
      - {axis: y, target_landmark: hand_middle_mcp, rest_direction: [1, 0, 0]}
      - {axis: x, target_landmark: hand_little_mcp,  rest_direction: [0, 1, 0]}
  thumb_metacarpal:
    parent: hand
    origin_landmark: hand_thumb_cmc
    landmarks: [hand_thumb_cmc, hand_thumb_mcp]
    axes:
      - {axis: y, target_landmark: hand_thumb_mcp, rest_direction: [1, 0, 0]}
  thumb_proximal:
    parent: thumb_metacarpal
    origin_landmark: hand_thumb_mcp
    landmarks: [hand_thumb_mcp, hand_thumb_ip]
    axes:
      - {axis: y, target_landmark: hand_thumb_ip, rest_direction: [1, 0, 0]}
  thumb_distal:
    parent: thumb_proximal
    origin_landmark: hand_thumb_ip
    landmarks: [hand_thumb_ip, hand_thumb_tip]
    axes:
      - {axis: y, target_landmark: hand_thumb_tip, rest_direction: [1, 0, 0]}
  index_proximal:
    parent: hand
    origin_landmark: hand_index_mcp
    landmarks: [hand_index_mcp, hand_index_pip]
    axes:
      - {axis: y, target_landmark: hand_index_pip, rest_direction: [1, 0, 0]}
  index_intermediate:
    parent: index_proximal
    origin_landmark: hand_index_pip
    landmarks: [hand_index_pip, hand_index_dip]
    axes:
      - {axis: y, target_landmark: hand_index_dip, rest_direction: [1, 0, 0]}
  index_distal:
    parent: index_intermediate
    origin_landmark: hand_index_dip
    landmarks: [hand_index_dip, hand_index_tip]
    axes:
      - {axis: y, target_landmark: hand_index_tip, rest_direction: [1, 0, 0]}
  middle_proximal:
    parent: hand
    origin_landmark: hand_middle_mcp
    landmarks: [hand_middle_mcp, hand_middle_pip]
    axes:
      - {axis: y, target_landmark: hand_middle_pip, rest_direction: [1, 0, 0]}
  middle_intermediate:
    parent: middle_proximal
    origin_landmark: hand_middle_pip
    landmarks: [hand_middle_pip, hand_middle_dip]
    axes:
      - {axis: y, target_landmark: hand_middle_dip, rest_direction: [1, 0, 0]}
  middle_distal:
    parent: middle_intermediate
    origin_landmark: hand_middle_dip
    landmarks: [hand_middle_dip, hand_middle_tip]
    axes:
      - {axis: y, target_landmark: hand_middle_tip, rest_direction: [1, 0, 0]}
  ring_proximal:
    parent: hand
    origin_landmark: hand_ring_mcp
    landmarks: [hand_ring_mcp, hand_ring_pip]
    axes:
      - {axis: y, target_landmark: hand_ring_pip, rest_direction: [1, 0, 0]}
  ring_intermediate:
    parent: ring_proximal
    origin_landmark: hand_ring_pip
    landmarks: [hand_ring_pip, hand_ring_dip]
    axes:
      - {axis: y, target_landmark: hand_ring_dip, rest_direction: [1, 0, 0]}
  ring_distal:
    parent: ring_intermediate
    origin_landmark: hand_ring_dip
    landmarks: [hand_ring_dip, hand_ring_tip]
    axes:
      - {axis: y, target_landmark: hand_ring_tip, rest_direction: [1, 0, 0]}
  little_proximal:
    parent: hand
    origin_landmark: hand_little_mcp
    landmarks: [hand_little_mcp, hand_little_pip]
    axes:
      - {axis: y, target_landmark: hand_little_pip, rest_direction: [1, 0, 0]}
  little_intermediate:
    parent: little_proximal
    origin_landmark: hand_little_pip
    landmarks: [hand_little_pip, hand_little_dip]
    axes:
      - {axis: y, target_landmark: hand_little_dip, rest_direction: [1, 0, 0]}
  little_distal:
    parent: little_intermediate
    origin_landmark: hand_little_dip
    landmarks: [hand_little_dip, hand_little_tip]
    axes:
      - {axis: y, target_landmark: hand_little_tip, rest_direction: [1, 0, 0]}

chains:
  thumb:  {start: hand, end: thumb_distal}
  index:  {start: hand, end: index_distal}
  middle: {start: hand, end: middle_distal}
  ring:   {start: hand, end: ring_distal}
  little: {start: hand, end: little_distal}
